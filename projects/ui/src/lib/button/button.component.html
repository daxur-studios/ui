<button
  [type]="type()"
  class="hud-button"
  [class]="'variant-' + variant()"
  [class.active]="value()"
  [attr.aria-pressed]="toggle() ? (value() ? 'true' : 'false') : null"
  [attr.aria-disabled]="isDisabled()"
  [attr.tabindex]="isDisabled() ? -1 : 0"
  (click)="activate()"
  (keydown)="onKeyDown($event)"
  (blur)="onBlur()"
>
  @switch (variant()) {
    @case ('bracket') {
      <svg
        class="bracket-svg"
        viewBox="0 0 100 40"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <path class="bracket bracket-tl" d="M 12 2 L 2 2 L 2 12" />
        <path class="bracket bracket-tr" d="M 88 2 L 98 2 L 98 12" />
        <path class="bracket bracket-bl" d="M 12 38 L 2 38 L 2 28" />
        <path class="bracket bracket-br" d="M 88 38 L 98 38 L 98 28" />
      </svg>
      <span class="label-text">{{ label() }}</span>
    }
    @case ('trace') {
      <div class="pip-wrapper" aria-hidden="true">
        <svg class="led-svg" viewBox="0 0 10 10" focusable="false">
          <circle cx="5" cy="5" r="3" class="led-pip" />
          <circle cx="5" cy="5" r="4.5" class="led-ring" />
        </svg>
      </div>
      <span class="label-text">{{ label() }}</span>
      <div class="bottom-trace" aria-hidden="true"></div>
    }
    @default {
      <svg
        class="frame-svg"
        viewBox="0 0 100 40"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <polygon class="frame-polygon" points="8,0 92,0 100,8 100,40 92,40 0,40 0,8" />
        <line class="accent-cut" x1="88" y1="2" x2="98" y2="12" />
      </svg>
      <span class="label-text">{{ label() }}</span>
    }
  }
</button>
